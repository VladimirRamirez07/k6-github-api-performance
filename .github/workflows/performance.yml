name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Cada lunes a las 8am UTC
  workflow_dispatch:       # Permite correrlo manualmente

jobs:
  performance:
    name: Run k6 Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run search-repos test
        env:
          GITHUB_TOKEN: ${{ secrets.K6_GITHUB_TOKEN }}
        run: k6 run tests/search-repos.js

      - name: Run list-issues test
        env:
          GITHUB_TOKEN: ${{ secrets.K6_GITHUB_TOKEN }}
        run: k6 run tests/list-issues.js

      - name: Run traffic-spike test
        env:
          GITHUB_TOKEN: ${{ secrets.K6_GITHUB_TOKEN }}
        run: k6 run tests/traffic-spike.js